{% extends "base.html" %}{% block content %}<section class="section"><div class="container" style="max-width:750px"><div class="form"><h1>{{'Edit Product' if p else 'Add Product'}}</h1><form method="post" enctype="multipart/form-data"><label>Name</label><input name="name" value="{{p.name if p else ''}}" required><label>Category</label><input name="category" value="{{p.category if p else ''}}" placeholder="Sphatlo/Kota" required><label>Description</label><textarea name="description">{{p.description if p else ''}}</textarea><div class="two"><div><label>Price (R)</label><input type="number" step="0.01" name="price" value="{{p.price if p else ''}}" required></div><div><label>Active</label><input type="checkbox" name="active" {% if not p or p.active %}checked{% endif %}></div></div><label>Meal options</label><input name="options" value="{{p.options if p else ''}}" placeholder="Chips,Cheese,Steak,Gravy"><p class="muted">Customers can choose these ingredients to add or remove.</p><label>Meal picture</label><input type="file" name="image" accept="image/*">{% if p and p.image %}<p><img src="{{url_for('static',filename='uploads/'+p.image)}}" style="max-width:220px;border-radius:15px"></p>{% endif %}<button class="btn" style="margin-top:15px">Save Product</button> <a class="btn secondary" href="/admin">Cancel</a></form></div></div></section>{% endblock %}
