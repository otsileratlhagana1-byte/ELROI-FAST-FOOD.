{% extends "base.html" %}{% block content %}<section class="section"><div class="container" style="max-width:750px"><div class="scanbox"><h1>Scan Customer Barcode</h1><p class="muted">Allow camera access, scan the barcode on the customer's receipt, then open the matching order.</p><div id="reader"></div><div class="form" style="margin-top:18px"><label>Or enter order number</label><input id="manual" placeholder="ELR-ABC123"><button class="btn" onclick="goManual()">Open Order</button></div></div></div></section><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script>function goManual(){let x=document.getElementById('manual').value.trim().toUpperCase();if(x)location='/order/'+x}function onScanSuccess(decodedText){let x=decodedText.trim().toUpperCase();if(x.startsWith('ELR-'))location='/order/'+x}const scanner=new Html5QrcodeScanner("reader",{fps:10,qrbox:{width:250,height:120},rememberLastUsedCamera:true},false);scanner.render(onScanSuccess);</script>{% endblock %}
